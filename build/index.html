<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build your game — Inside Joke Games</title>
<meta name="description" content="Build a game about your own group in about five minutes -- your names, your stories, your catchphrase. Play it instantly, free.">
<meta name="theme-color" content="#141428">
<meta property="og:type" content="website">
<meta property="og:title" content="Build your game — Inside Joke Games">
<meta property="og:description" content="Your names, your stories, your catchphrase -- a playable game link in minutes, free.">
<meta property="og:url" content="https://unique-name27.github.io/inside-joke-games/build/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141428'/%3E%3Ctext x='8' y='12' font-size='9' text-anchor='middle' fill='%23e8b84b' font-family='monospace' font-weight='bold'%3EHA%3C/text%3E%3C/svg%3E">
<style>
  /* Same design system as the storefront root index.html (duplicated on
     purpose -- each page here is self-contained, no shared stylesheet). */
  :root{
    --bg:#141428; --surface:#241a22; --surface-2:#332531;
    --border:rgba(243,233,210,0.14); --border-strong:rgba(232,184,75,0.45);
    --gold:#e8b84b; --gold-hover:#f0c766; --gold-ink:#241a22;
    --terracotta:#c96f4a; --cream:#f3e9d2;
    --muted:#b9ab95; --muted-2:#948798; --danger:#e0645a;
    --radius-sm:8px; --radius-md:12px; --radius-lg:18px;
    --space-4:16px; --space-5:24px; --space-6:32px;
    --maxw-narrow:720px;
    --font-sans:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
    --shadow-sm:0 1px 2px rgba(0,0,0,0.35);
    --fs-h1:clamp(1.6rem, 1.3rem + 1vw, 2rem);
    --fs-body:clamp(1rem, 0.96rem + 0.15vw, 1.0625rem);
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{background:var(--bg); scroll-behavior:smooth;}
  body{
    margin:0; background:var(--bg); color:var(--cream);
    font-family:var(--font-sans); line-height:1.55; font-size:var(--fs-body); padding-bottom:60px;
    -webkit-font-smoothing:antialiased;
    background-image:
      radial-gradient(ellipse at 15% -10%, rgba(232,184,75,0.09), transparent 50%),
      radial-gradient(ellipse at 90% 0%, rgba(201,111,74,0.09), transparent 45%);
  }
  img,canvas,svg{max-width:100%; height:auto; display:block;}
  a{color:var(--gold);}
  h1,h2{ font-family:var(--font-sans); color:var(--cream); font-weight:800; letter-spacing:-0.01em; margin:0 0 8px; }
  h1{ font-size:var(--fs-h1); text-align:center; }
  h2{ font-size:1.2rem; }
  p{ margin:0 0 1em; }
  :focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:3px; }
  :focus:not(:focus-visible){ outline:none; }
  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    *,*::before,*::after{ animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important; scroll-behavior:auto !important; }
  }

  .container{ max-width:960px; margin:0 auto; padding-inline:clamp(16px,4vw,32px); }
  .container-narrow{ max-width:var(--maxw-narrow); }

  /* ---------- header ---------- */
  .site-header{
    position:sticky; top:0; z-index:100;
    background:rgba(20,20,40,0.88); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
  }
  .header-inner{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding-block:12px; }
  .logo-link{ display:inline-flex; align-items:center; padding:4px; border-radius:6px; }
  #logoCanvas{ image-rendering:pixelated; height:22px; width:auto; }
  .backlink{ font-size:0.85rem; color:var(--muted); text-decoration:none; padding:10px 4px; min-height:44px; display:inline-flex; align-items:center; }
  .backlink:hover{ color:var(--gold); }

  .builder-head{ padding-block:28px 4px; }
  .step-sub{ color:var(--muted); font-size:0.95rem; margin:0 0 22px; }

  /* ---------- step progress ---------- */
  .progress-row{ display:flex; gap:4px; margin:18px 0 8px; }
  .progress-seg{ flex:1; height:6px; border-radius:999px; background:var(--surface-2); }
  .progress-seg.done{ background:var(--gold); }
  .progress-seg.current{ background:var(--terracotta); }
  .step-label{ font-size:0.78rem; color:var(--muted); text-align:center; margin:0 0 4px; text-transform:uppercase; letter-spacing:0.05em; }

  /* ---------- form fields ---------- */
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:0.85rem; color:var(--cream); margin-bottom:6px; font-weight:700; }
  label .opt{ color:var(--muted-2); font-weight:400; }
  input[type=text], textarea{
    width:100%; background:var(--bg); border:1.5px solid var(--border-strong);
    border-radius:var(--radius-sm); color:var(--cream); font-size:1rem; padding:12px 14px;
    font-family:inherit; min-height:44px;
  }
  textarea{ min-height:72px; resize:vertical; }
  input[type=text]:focus, textarea:focus{ outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold); }
  input::placeholder, textarea::placeholder{ color:var(--muted-2); }
  .charcount{ font-size:11px; color:var(--muted-2); text-align:right; margin-top:4px; }
  .charcount.over{ color:var(--danger); font-weight:700; }
  .field-warning{ font-size:12px; color:var(--danger); margin-top:6px; display:none; }
  .field-warning.show{ display:block; }

  /* ---------- buttons ---------- */
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    font-family:var(--font-sans); font-weight:700; text-decoration:none; cursor:pointer;
    border:1.5px solid transparent; border-radius:var(--radius-md);
    padding:12px 20px; font-size:0.92rem; min-height:44px; box-shadow:var(--shadow-sm);
    transition:transform 120ms ease, background 120ms ease, border-color 120ms ease;
  }
  .btn:hover{ transform:translateY(-1px); }
  .btn:active{ transform:translateY(0); }
  .btn-primary{ background:var(--gold); color:var(--gold-ink); border-color:var(--gold); }
  .btn-primary:hover{ background:var(--gold-hover); }
  .btn-secondary{ background:transparent; color:var(--cream); border-color:var(--border-strong); }
  .btn-secondary:hover{ background:rgba(232,184,75,0.08); border-color:var(--gold); }
  .btn-sm{ padding:8px 14px; font-size:0.82rem; min-height:38px; }
  .btn-block{ width:100%; }
  .btn[disabled], .btn[aria-disabled="true"]{
    background:var(--surface-2); color:var(--muted-2); border-color:var(--border);
    box-shadow:none; cursor:not-allowed; pointer-events:none; transform:none;
  }
  .btn-row{ display:flex; gap:12px; margin-top:28px; }
  .btn-row .btn{ flex:1; }
  @media (max-width:480px){ .btn-row{ flex-direction:column-reverse; } }

  /* ---------- cards ---------- */
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:clamp(18px,3vw,24px); margin-bottom:14px; }
  .story-card{ position:relative; }
  .story-remove{
    position:absolute; top:14px; right:16px; font-size:12px; color:var(--muted-2);
    background:none; border:none; cursor:pointer; text-decoration:underline; padding:8px; min-height:32px;
  }
  .story-remove:hover{ color:var(--danger); }

  /* ---------- role cards ---------- */
  .role-card{ display:flex; gap:16px; align-items:flex-start; }
  .role-icon{
    width:56px; height:56px; border-radius:12px; background:rgba(232,184,75,0.10);
    display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .role-icon canvas{ image-rendering:pixelated; }
  .role-body{ flex:1; min-width:0; }
  .role-title-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .role-title-row h2{ margin:0; }
  .role-desc{ font-size:0.88rem; color:var(--muted); margin:4px 0 14px; }
  .skip-toggle{
    display:inline-flex; align-items:center; gap:8px; font-size:0.8rem; color:var(--cream);
    cursor:pointer; user-select:none; text-transform:uppercase; letter-spacing:0.04em;
    padding:6px 4px; min-height:32px;
  }
  .skip-toggle input{ accent-color:var(--gold); width:18px; height:18px; cursor:pointer; }
  .role-fields{ margin-top:6px; transition:opacity 150ms ease; }
  .role-fields.skipped{ opacity:0.4; pointer-events:none; }
  @media (max-width:560px){ .role-card{ flex-direction:column; } .role-icon{ width:48px; height:48px; } }

  /* ---------- vibe cards (also used by the scene/"setting" cards -- same
     tap-to-select pattern, see .scene-card below) ---------- */
  .vibe-card, .scene-card{
    display:flex; align-items:center; justify-content:space-between; gap:14px;
    cursor:pointer; width:100%; text-align:left; background:var(--surface);
  }
  .vibe-card:focus-visible, .scene-card:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .vibe-card.selected, .scene-card.selected{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; }
  .vibe-label, .scene-label{ font-weight:700; font-size:0.95rem; }
  .vibe-sub, .scene-sub{ font-size:0.8rem; color:var(--muted-2); margin-top:2px; }
  .vibe-sub{ text-transform:capitalize; }
  .vibe-play{ flex-shrink:0; }

  /* ---------- preview / share ---------- */
  .copybox{ display:flex; gap:8px; align-items:stretch; }
  .copybox input{ flex:1; font-size:0.85rem; min-height:40px; }
  .link-len{ font-size:11px; color:var(--muted-2); margin-top:6px; }
  .upsell{ border-color:var(--gold); box-shadow:0 0 0 1px var(--gold) inset; background:linear-gradient(180deg, rgba(232,184,75,0.09), var(--surface) 45%); }
  .warning-banner{
    background:rgba(224,100,90,0.14); border:1px solid var(--danger); border-radius:var(--radius-md);
    padding:14px 16px; font-size:0.9rem; margin:16px 0; display:none; color:var(--cream);
  }
  .warning-banner.show{ display:block; }
  .warning-banner ul{ margin:8px 0 0; padding-left:20px; }

  /* ---------- answers review (preview step, above the play/share card)
     -- dense: small text, one row per step, an Edit link that jumps back.
     Renders straight from `state` every time, so it's always accurate. ---------- */
  .review-row{
    display:flex; align-items:baseline; gap:10px; padding:8px 0;
    border-top:1px solid var(--border); font-size:0.85rem;
  }
  .review-row:first-of-type{ border-top:none; }
  .review-label{ flex:0 0 96px; color:var(--muted-2); text-transform:uppercase; font-size:0.7rem; letter-spacing:0.04em; font-weight:700; }
  .review-value{ flex:1; color:var(--cream); min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .review-edit{
    flex:0 0 auto; background:none; border:none; color:var(--gold); font-size:0.78rem;
    font-weight:700; cursor:pointer; padding:4px 2px; text-decoration:underline;
  }
  .review-edit:hover{ color:var(--gold-hover); }
  @media (max-width:480px){
    .review-row{ flex-wrap:wrap; }
    .review-label{ flex-basis:100%; }
    .review-value{ white-space:normal; }
  }

  /* ---------- sprite strip (PHASE C: "which one is them?") -- a compact,
     horizontally-scrollable row of tappable tile swatches. Used in each
     role card, the main-character/extra-friend fields, and (at a much
     smaller size) inline in the review-card rows. ---------- */
  .sprite-field{ margin-top:14px; }
  .sprite-field-label{ font-size:0.78rem; color:var(--muted); margin:0 0 8px; text-transform:uppercase; letter-spacing:0.04em; font-weight:700; }
  .sprite-strip{ display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; }
  .sprite-swatch{
    flex:0 0 auto; width:52px; height:52px; padding:3px; scroll-snap-align:start;
    background:var(--bg); border:2px solid var(--border-strong); border-radius:10px;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .sprite-swatch canvas{ width:100%; height:100%; image-rendering:pixelated; -ms-interpolation-mode:nearest-neighbor; }
  .sprite-swatch:hover{ border-color:var(--gold); }
  .sprite-swatch.selected{ border-color:var(--gold); box-shadow:0 0 0 2px var(--gold) inset; background:rgba(232,184,75,0.10); }
  .sprite-swatch:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .sprite-swatch-label{ font-size:10px; color:var(--muted-2); text-align:center; margin-top:4px; }

  .review-value.has-sprites{ display:flex; align-items:center; gap:6px; overflow:visible; white-space:normal; }
  .review-sprite-icon{ flex:0 0 auto; width:20px; height:20px; border-radius:5px; border:1px solid var(--border-strong); image-rendering:pixelated; background:var(--bg); }

  /* ---------- PEOPLE FIRST (SPEC-people.md round 2) -- the people step's
     "who's who?" tap-to-pick chips (host + the five role rows). Same
     tap-target sizing (min-height 44px hit area via padding) as every
     other interactive control in this wizard. ---------- */
  .person-chip-row{ display:flex; flex-wrap:wrap; gap:8px; margin:8px 0 4px; }
  .person-chip{
    display:inline-flex; align-items:center; gap:6px; padding:8px 14px; min-height:40px;
    border-radius:999px; background:var(--surface-2); border:1.5px solid var(--border-strong);
    color:var(--cream); font-size:0.85rem; font-weight:600; cursor:pointer;
  }
  .person-chip:hover{ border-color:var(--gold); }
  .person-chip.selected{ border-color:var(--gold); background:rgba(232,184,75,0.14); color:var(--gold); }
  .person-chip.skip-chip{ color:var(--muted); font-weight:400; }
  .person-chip.skip-chip.selected{ color:var(--muted-2); border-color:var(--muted-2); background:transparent; }
  .person-chip canvas{ width:22px; height:22px; image-rendering:pixelated; border-radius:5px; flex:0 0 auto; }
  .person-chip:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; }
  .people-reassure{ font-size:0.85rem; color:var(--muted); margin:18px 0 0; }
</style>
</head>
<body>

<header class="site-header">
  <div class="container container-narrow header-inner">
    <a class="logo-link" href="../" aria-label="Inside Joke Games — home">
      <canvas id="logoCanvas" aria-hidden="true"></canvas>
    </a>
    <a class="backlink" href="../">&larr; Back to Inside Joke Games</a>
  </div>
</header>

<div class="container container-narrow builder-head">
  <h1>Build your game</h1>
  <div class="progress-row" id="progressRow"></div>
  <p class="step-label" id="stepLabel"></p>
</div>

<main class="container container-narrow" id="stepsContainer">
  <!-- steps are rendered into here by renderStep() -->
</main>

<script src="../game/roster.js"></script>
<script src="../game/cfgcodec.js"></script>
<script>
'use strict';
/* ======================================================================
   build/index.html -- the self-serve wizard. Same product as the
   FULFILLMENT.md/tools/generate.js pipeline, but entirely client-side and
   interactive: assembles a CONFIG in the browser, validates it through
   the EXACT SAME whitelist game/cfgcodec.js uses for a real `#cfg=` link
   (no separate/looser rules for "preview" vs "the real thing"), and lets
   the user play their own game immediately -- no deployment, no wait.

   Structure: PURE LOGIC first (state shape, config assembly, the content
   gate) -- no `document`/`window` references anywhere in this section, on
   purpose, so it can be lifted into a Node `vm` sandbox and harness-tested
   headlessly, the same methodology this whole project's verification has
   used throughout (see the harness this round's summary references).
   DOM WIRING second, guarded behind initWizard() which only ever runs via
   a DOMContentLoaded listener -- so simply evaluating this script (as a
   harness does) never touches the DOM at all.
   ====================================================================== */

/* ---------------------------------------------------------------------
   PURE LOGIC
   --------------------------------------------------------------------- */
// STORY SKELETONS -- the four settings (see SPEC-skeletons.md /
// game/skeletons.js, the engine-shipped presentation code these keys
// select). `key` is exactly what CFG_FRAGMENT_SCHEMA.scene whitelists
// (CFG_SCENE_KEYS, from game/cfgcodec.js loaded above this script) --
// this array is the wizard's own UI-facing copy (order/label/desc), not a
// second source of truth for which keys are valid.
const SCENE_DEFS = [
  { key:'dinner', label:'THE DINNER PARTY', desc:'A table, some stories, one unforgettable question.' },
  { key:'roadtrip', label:'THE ROAD TRIP', desc:'A campfire at the rest stop, stories from the road.' },
  { key:'office', label:'THE OFFICE PARTY', desc:'The break room, after hours.' },
  { key:'wedding', label:'THE WEDDING WEEKEND', desc:'A reception hall, a DJ booth, and the toasts.' },
];
// THE GALLERY (template #2, see SPEC-gallery.md) -- step 0, "What's the
// joke?", picks CFG_TEMPLATE_KEYS (game/cfgcodec.js, loaded above this
// script). `key` is exactly what CONFIG.template whitelists; `desc` is the
// joke-shape framing that recommends the template, `label` the resulting
// game style's name. Only the BUILT templates get a card here --
// SPEC-game-styles.md sketches a longer catalog, but this wizard only ever
// offers what actually ships. THE MISSION is template #5 (SPEC-mission.md).
const JOKE_DEFS = [
  { key:'hangout', desc:'A place you always end up + the stories you retell', label:'The Hangout' },
  { key:'gallery', desc:'The things your group can’t stop roasting', label:'The Gallery' },
  { key:'flight', desc:'A disaster trip you keep retelling', label:'The Flight' },
  { key:'defense', desc:'A recurring annoyance the group defends against', label:'The Defense' },
  { key:'mission', desc:'Us against the world', label:'The Mission' },
];
// Per-template step SEQUENCES (keys into STEP_RENDERERS/STEP_LABELS below).
// The joke step is always first and always shared -- a hard invariant
// every sequence below keeps at index 0; the setting step only exists on
// the Hangout path (SPEC-gallery.md: "The setting step shows only on the
// Hangout path"); the Gallery path gets `targets`, the Flight path gets
// `trip`, the Defense path gets `annoyance`, instead of `stories` as their
// own content step. Every other step (punchline/people/vibe/preview) is
// shared verbatim across all five sequences.
//
// PEOPLE FIRST (SPEC-people.md round 2) -- the old `group` step (host name
// + "anyone else in the room?") and `cast` step (five role cards) are BOTH
// gone, replaced by the single `people` step: "who's in it?" (the person
// list) then "who's who?" (host pick + role assignment), two sections of
// ONE step -- see renderStepPeople. `group` is genuinely redundant now
// (the host is just one more person, picked via state.assign.host; the old
// "anyone else" field is now whichever person(s) end up unassigned), so it
// doesn't move anywhere -- it's deleted outright. `people` sits where
// `cast` used to (same position relative to the content step/vibe/preview
// -- "replacing the old cast step position", SPEC-people.md), so removing
// `group` is the one place total step count actually drops (8->7 Hangout,
// 7->6 the other four) -- a necessary, documented consequence of folding
// host-naming into the people list, not an oversight.
const HANGOUT_STEP_KEYS = ['joke', 'setting', 'punchline', 'stories', 'people', 'vibe', 'preview'];
const GALLERY_STEP_KEYS = ['joke', 'punchline', 'targets', 'people', 'vibe', 'preview'];
const FLIGHT_STEP_KEYS = ['joke', 'punchline', 'trip', 'people', 'vibe', 'preview'];
const DEFENSE_STEP_KEYS = ['joke', 'punchline', 'annoyance', 'people', 'vibe', 'preview'];
const MISSION_STEP_KEYS = ['joke', 'punchline', 'mission', 'people', 'vibe', 'preview'];
function stepSequence(template){
  if(template === 'gallery') return GALLERY_STEP_KEYS;
  if(template === 'flight') return FLIGHT_STEP_KEYS;
  if(template === 'defense') return DEFENSE_STEP_KEYS;
  if(template === 'mission') return MISSION_STEP_KEYS;
  return HANGOUT_STEP_KEYS;
}
function stepCount(template){ return stepSequence(template).length; }
const STEP_LABELS = {
  joke: 'What’s the joke?', setting: 'The setting', punchline: 'The catchphrase',
  stories: 'The stories', targets: 'The targets', trip: 'The trip', annoyance: 'The annoyance', mission: 'The mission', people: 'Who’s in it?', vibe: 'The vibe', preview: 'Preview & share',
};
// gallery.targets: 4-8 short labels -- the wizard's own UI guideline
// (mirrors the stories step's "2-4" guideline just below it, also not a
// hard codec limit -- see game/cfgcodec.js's CFG_GALLERY_SCHEMA, which
// only caps the ceiling and per-string length, same "structural safety
// net, not the UX guidance" split every array field there draws).
const GALLERY_TARGETS_MIN = 4, GALLERY_TARGETS_MAX = 8;
// THE FLIGHT (template #3, see SPEC-flight.md's config/codec/wizard
// section) -- same "UI guideline, not a codec limit" split as the gallery
// targets above (game/cfgcodec.js's CFG_FLIGHT_SCHEMA only caps the
// ceiling at 6 for both arrays). Four plane colors, a fixed enum -- see
// CFG_FLIGHT_SCHEMA's planeColor field.
const FLIGHT_BEATS_MIN = 3, FLIGHT_BEATS_MAX = 6;
const FLIGHT_HAZARDS_MIN = 2, FLIGHT_HAZARDS_MAX = 6;
const FLIGHT_PLANE_COLORS = [
  { key:'yellow', label:'Yellow' }, { key:'red', label:'Red' }, { key:'blue', label:'Blue' }, { key:'green', label:'Green' },
];
// THE DEFENSE (template #4, see SPEC-defense.md's config/codec/wizard
// section) -- same "UI guideline, not a codec limit" split as the gallery/
// flight arrays above (game/cfgcodec.js's CFG_DEFENSE_SCHEMA only caps the
// ceiling at 6). `defending` (THE THING's plaque label) has no min/max
// pair of its own -- it's a single required 24-char field, checked
// directly in renderStepPreview's contentOk, same as the main character
// requirement (see hostOk there).
const DEFENSE_WAVES_MIN = 3, DEFENSE_WAVES_MAX = 6;
// THE MISSION (template #5, see SPEC-mission.md's config/codec/wizard
// section) -- same "UI guideline, not a codec limit" split as the gallery/
// flight/defense arrays above (game/cfgcodec.js's CFG_MISSION_SCHEMA only
// caps the ceiling at 6 for swarms). Four ship colors, a fixed enum -- see
// CFG_MISSION_SCHEMA's shipColor field.
const MISSION_SWARMS_MIN = 2, MISSION_SWARMS_MAX = 6;
const MISSION_SHIP_COLORS = [
  { key:'blue', label:'Blue' }, { key:'green', label:'Green' }, { key:'orange', label:'Orange' }, { key:'red', label:'Red' },
];
// Role framing: BOSS SLOTS, not personality archetypes -- the product's
// promise is that every boss is a real person the group knows. `key`/
// `cfgKey` (the underlying CONFIG.cast/answers-schema keys: judge,
// authority) are unchanged -- this is presentation/copy only, see
// buildOverridesFromState below for the matching judge.title/
// authority.cardTitle behavior (the boss bar/entrance card show the
// PERSON's name, not a generic label, once that slot is cast).
const ROLE_DEFS = [
  { key:'critic', cfgKey:'judge', title:'THE FIRST BOSS',

/* the Preview step's "Your answers" review card -- one row per earlier
   step, `summary(state)` reads straight off the live wizard state (never
   a snapshot), so it's always accurate, including right after an Edit
   round-trip. `stepKey` is looked up in the CURRENT template's own
   sequence (stepSequence) to find the index renderStep()/state.step jumps
   back to -- a raw numeric index would silently point at the wrong step
   once the two paths' sequences diverge (see HANGOUT_STEP_KEYS/
   GALLERY_STEP_KEYS above). `showFor`, when present, hides a row entirely
   on the other path (THE GALLERY: no setting/stories rows; THE HANGOUT: no
   targets row) -- the render loop below skips any row whose showFor
   doesn't include state.template. */
const REVIEW_ROWS = [
  { stepKey:'joke', label:'The joke', summary(state){
      const j = JOKE_DEFS.find(j => j.key === state.template);
      return j ? j.label : 'Not chosen yet';
    } },
  { stepKey:'setting', showFor:['hangout'], label:'The setting', summary(state){
      const scene = SCENE_DEFS.find(s => s.key === state.scene);
      return scene ? scene.label : 'Not chosen yet';
    } },
  { stepKey:'punchline', label:'The catchphrase', summary(state){
      if(!state.catchphrase.trim() && !state.title.trim()) return 'Not filled in yet';
      return (state.catchphrase.trim() || '…') + ' · ' + (state.title.trim() || '…');
    } },
  { stepKey:'stories', showFor:['hangout'], label:'The stories', summary(state){
      const filled = state.stories.filter(s => (s.l1 && s.l1.trim()) || (s.l2 && s.l2.trim()));
      if(!filled.length) return 'No stories yet';
      return filled.length + ' ' + (filled.length===1 ? 'story' : 'stories') + ': ' +
        filled.map(s => (s.l1 && s.l1.trim()) || '…').join(' / ');
    } },
  { stepKey:'targets', showFor:['gallery'], label:'The targets', summary(state){
      const filled = state.targets.filter(t => t && t.trim());
      if(filled.length < GALLERY_TARGETS_MIN) return filled.length + ' of ' + GALLERY_TARGETS_MIN + ' minimum filled in';
      return filled.length + ' targets: ' + filled.slice(0,3).map(t=>t.trim()).join(' / ') + (filled.length>3 ? '…' : '');
    } },
  { stepKey:'trip', showFor:['flight'], label:'The trip', summary(state){
      const filled = state.beats.filter(b => b && b.trim());
      if(filled.length < FLIGHT_BEATS_MIN) return filled.length + ' of ' + FLIGHT_BEATS_MIN + ' minimum legs filled in';
      return filled.length + ' legs: ' + filled.slice(0,3).map(b=>b.trim()).join(' / ') + (filled.length>3 ? '…' : '');
    } },
  // THE DEFENSE (template #4) -- Defense-path only, this template's own
  // content row (what targets/trip are to gallery/flight).
  { stepKey:'annoyance', showFor:['defense'], label:'The annoyance', summary(state){
      const filled = state.waves.filter(w => w && w.trim());
      if(!state.defending.trim() || filled.length < DEFENSE_WAVES_MIN) return 'Not filled in yet';
      return 'Defending ' + state.defending.trim() + ' -- ' + filled.length + ' waves: ' + filled.slice(0,3).map(w=>w.trim()).join(' / ') + (filled.length>3 ? '…' : '');
    } },
  // THE MISSION (template #5) -- Mission-path only, this template's own
  // content row (what targets/trip/annoyance are to the other three).
  { stepKey:'mission', showFor:['mission'], label:'The mission', summary(state){
      const filled = state.swarms.filter(sw => sw && sw.trim());
      if(!state.mission.trim() || filled.length < MISSION_SWARMS_MIN) return 'Not filled in yet';
      return state.mission.trim() + ' -- ' + filled.length + ' swarms: ' + filled.slice(0,3).map(sw=>sw.trim()).join(' / ') + (filled.length>3 ? '…' : '');
    } },
  // PEOPLE FIRST (SPEC-people.md round 2) -- one row for the whole people
  // step (both sections -- see renderStepPeople): who's in it + who ended
  // up as host + how many of the five roles got assigned. Named helpers
  // (personAt/assignedRoleCount) live next to buildOverridesFromState
  // below, reused here so this row never re-derives the same logic twice.
  { stepKey:'people', label:'The people', summary(state){
      const named = (state.people||[]).filter(p => p && p.name && p.name.trim());
      if(!named.length) return 'Not filled in yet';
      const host = personAt(state, state.assign && state.assign.host);
      const roleCount = assignedRoleCount(state);
      return (host && host.name.trim() ? host.name.trim() + ' (host)' : 'no host picked yet') +
        ' + ' + named.length + ' ' + (named.length===1 ? 'person' : 'people') +
        ' -- ' + roleCount + ' ' + (roleCount===1 ? 'role' : 'roles') + ' assigned';
    },
    // PHASE C: one tiny sprite per named person, in list order.
    sprites(state){
      return (state.people||[]).filter(p => p && p.name && p.name.trim()).map(p => p.sprite || DEFAULT_ROSTER_KEY.diner0).filter(Boolean);
    } },
  { stepKey:'vibe', label:'The vibe', summary(state){
      const vibe = VIBE_DEFS.find(v => v.key === state.vibe);
      return vibe ? vibe.label : 'Not chosen yet';
    } },
];

const WIZARD_STORAGE_KEY = 'ijg_build_wizard_v1';

/* ======================================================================
   PEOPLE FIRST (SPEC-people.md round 2) -- state model v2. `state.people`
   is 3-6 {name, sprite, quotes:['','',''], anecdote} cards -- ONE list,
   not a role-keyed cast object; `state.assign` maps each of host/critic/
   boss/savior/butterfingers/builder to an INDEX into `people` (or null =
   unassigned/skipped) -- one person holds at most one role, host is
   required. `state.roleLines` is the two boss-line fields (heckle for
   critic/THE FIRST BOSS, quirk for boss/THE FINAL BOSS) -- these stay
   keyed on the ROLE, not the person (SPEC-people.md: "per-template boss
   line fields stay where they are"), since they're really a property of
   "whoever ends up in that seat this game," shown once that role has
   someone assigned. Unassigned people aren't lost -- see
   buildOverridesFromState: the first becomes cast.diner0, up to 2 more
   become `extras[]`.
   ====================================================================== */
const PEOPLE_MIN = 3, PEOPLE_MAX = 6;
const ROLE_KEYS = ROLE_DEFS.map(r => r.key); // ['critic','boss','savior','butterfingers','builder']
const ASSIGN_KEYS = ['host'].concat(ROLE_KEYS);
function defaultPerson(){ return { name:'', sprite:null, quotes:['','',''], anecdote:'' }; }
function defaultAssign(){
  const a = {};
  for(const k of ASSIGN_KEYS) a[k] = null;
  return a;
}
function defaultWizardState(){
  return {
    step: 0,
    template: 'hangout', // THE GALLERY (template #2) / THE FLIGHT (template #3) / THE DEFENSE (template #4) -- carried by the draft; old (pre-Gallery) saved drafts normalize to this, see normalizeWizardState
    scene: 'dinner',
    people: [ defaultPerson(), defaultPerson(), defaultPerson() ], // PEOPLE_MIN cards to start
    assign: defaultAssign(),
    roleLines: { critic: '', boss: '' }, // the heckle/quirk boss lines -- see this block's own header
    catchphrase: '', title: '', offLimits: '',
    stories: [ {l1:'',l2:''}, {l1:'',l2:''} ],
    targets: ['', '', '', ''], // gallery only -- see GALLERY_TARGETS_MIN
    beats: ['', '', ''], // flight only -- see FLIGHT_BEATS_MIN
    hazards: ['', ''], // flight only -- see FLIGHT_HAZARDS_MIN
    planeColor: 'yellow', // flight only -- see FLIGHT_PLANE_COLORS
    defending: '', // defense only -- see DEFENSE_WAVES_MIN's own comment
    waves: ['', '', ''], // defense only -- see DEFENSE_WAVES_MIN
    mission: '', // mission only -- the mission-objective banner line
    swarms: ['', ''], // mission only -- see MISSION_SWARMS_MIN
    shipColor: 'blue', // mission only -- see MISSION_SHIP_COLORS
    vibe: null,
  };
}

/* person the given assign-value (a `people` index, or null) resolves to,
   or null. Used everywhere a role/host lookup needs "give me the actual
   person object, or nothing" without re-checking bounds inline. */
function personAt(state, idx){
  if(idx === null || idx === undefined) return null;
  const people = state.people || [];
  return (idx >= 0 && idx < people.length) ? people[idx] : null;
}
function assignedRoleCount(state){
  let n = 0;
  for(const key of ROLE_KEYS){
    const p = personAt(state, state.assign && state.assign[key]);
    if(p && p.name && p.name.trim()) n++;
  }
  return n;
}
/* every `people` index NOT claimed by host or any of the five roles, in
   list order -- exactly the pool buildOverridesFromState's diner0/extras
   split (and the overflow gate in renderStepPeople) both read from. */
function unassignedPeople(state){
  const people = state.people || [];
  const assign = state.assign || {};
  const claimed = new Set();
  for(const key of ASSIGN_KEYS){ if(typeof assign[key] === 'number') claimed.add(assign[key]); }
  const out = [];
  for(let i=0;i<people.length;i++){ if(!claimed.has(i)) out.push(people[i]); }
  return out;
}

/* ---- normalization helpers (also reused by the vm test harness) ---- */
function normalizePerson(p){
  const src = (p && typeof p === 'object') ? p : {};
  const q = Array.isArray(src.quotes) ? src.quotes : [];
  return {
    name: typeof src.name === 'string' ? src.name.slice(0, 40) : '',
    sprite: (src.sprite && ROSTER_BY_KEY[src.sprite]) ? src.sprite : null,
    quotes: [0,1,2].map(i => typeof q[i] === 'string' ? q[i].slice(0, 60) : ''),
    anecdote: typeof src.anecdote === 'string' ? src.anecdote.slice(0, 160) : '',
  };
}
function normalizePeopleArray(rawPeople){
  let arr = Array.isArray(rawPeople) && rawPeople.length ? rawPeople.map(normalizePerson) : [];
  arr = arr.slice(0, PEOPLE_MAX);
  while(arr.length < PEOPLE_MIN) arr.push(defaultPerson());
  return arr;
}
function normalizeAssign(rawAssign, peopleCount){
  const out = defaultAssign();
  const raw = (rawAssign && typeof rawAssign === 'object') ? rawAssign : {};
  const used = new Set();
  for(const key of ASSIGN_KEYS){
    const v = raw[key];
    if(typeof v === 'number' && v >= 0 && v < peopleCount && !used.has(v)){ out[key] = v; used.add(v); }
  }
  return out;
}
function normalizeRoleLines(rawRoleLines){
  const raw = (rawRoleLines && typeof rawRoleLines === 'object') ? rawRoleLines : {};
  return {
    critic: typeof raw.critic === 'string' ? raw.critic.slice(0, 60) : '',
    boss: typeof raw.boss === 'string' ? raw.boss.slice(0, 60) : '',
  };
}

/* PEOPLE FIRST (SPEC-people.md round 2) migration -- an old draft (role-
   keyed `cast` + `host`/`otherFriendName` strings, whether or not it also
   has a `template` key -- a pre-Gallery draft is just the oldest version
   of this same old shape) converts LOSSLESSLY to people+assign: the typed
   host string becomes person 0 (assign.host=0); each `cast:true` role
   becomes its own person, carrying that role's name/sprite/anecdote, plus
   its heckle/quirk line into `roleLines` if it had one; `otherFriendName`
   (today's "anyone else in the room?") becomes one more person, left
   unassigned (this is exactly what buildOverridesFromState already turns
   an unassigned person INTO -- cast.diner0 -- so a migrated draft's
   compiled config comes out byte-identical to what the old shape used to
   produce). Never crashes, never drops a typed name -- every string field
   is guarded the same defensive way normalizePerson/normalizeAssign are.
   Detected by ABSENCE of `people`/`assign` (the v2 shape's own two keys)
   rather than presence of `template` -- so this same function handles
   both "pre-Gallery" and "post-Gallery, pre-round-2" saved drafts with
   one code path, and a v2 (or already-migrated) draft never re-runs it. */
function migrateToPeopleShape(saved){
  const people = [];
  const assign = defaultAssign();
  const roleLines = { critic: '', boss: '' };
  const hostName = typeof saved.host === 'string' ? saved.host : '';
  const hostSprite = (saved.hostSprite && ROSTER_BY_KEY[saved.hostSprite]) ? saved.hostSprite : null;
  people.push({ name: hostName, sprite: hostSprite, quotes: ['','',''], anecdote: '' });
  assign.host = 0;
  const oldCast = (saved.cast && typeof saved.cast === 'object') ? saved.cast : {};
  for(const r of ROLE_DEFS){
    const c = oldCast[r.key];
    if(c && c.cast && c.name && String(c.name).trim()){
      const idx = people.length;
      people.push({
        name: String(c.name),
        sprite: (c.sprite && ROSTER_BY_KEY[c.sprite]) ? c.sprite : null,
        quotes: ['','',''],
        anecdote: typeof c.anecdote === 'string' ? c.anecdote : '',
      });
      assign[r.key] = idx;
      // every ROLE_DEFS entry's galleryField/flightField/defenseField/
      // missionField share the SAME key per role ('heckle' for critic,
      // 'quirk' for boss -- see that array's own header) regardless of
      // which template was active when this draft was saved, so reading
      // c.heckle/c.quirk directly (rather than picking a field variant)
      // is correct for every old draft, whichever template it was on.
      if(r.key === 'critic' && typeof c.heckle === 'string') roleLines.critic = c.heckle;
      if(r.key === 'boss' && typeof c.quirk === 'string') roleLines.boss = c.quirk;
    }
  }
  const otherName = typeof saved.otherFriendName === 'string' ? saved.otherFriendName.trim() : '';
  if(otherName){
    const otherSprite = (saved.otherFriendSprite && ROSTER_BY_KEY[saved.otherFriendSprite]) ? saved.otherFriendSprite : null;
    people.push({ name: otherName, sprite: otherSprite, quotes: ['','',''], anecdote: '' });
  }
  while(people.length < PEOPLE_MIN) people.push(defaultPerson());
  return Object.assign({}, saved, { people: people, assign: assign, roleLines: roleLines });
}

/* shallow-merges a possibly-partial/stale saved state onto a fresh
   default so a schema change never crashes a returning visitor with old
   localStorage data -- same "never trust old persisted shape blindly"
   spirit as cfgDeepMerge, kept intentionally simpler since this is
   trusted same-origin data, not an untrusted link. Migrates an old
   (role-keyed-cast) draft to the v2 people+assign shape FIRST (see
   migrateToPeopleShape) -- every line after that point only ever sees a
   v2-shaped draft, migrated or already-v2 alike; a migrated OR v2 draft
   both round-trip as v2 from here on (SPEC-people.md: "Post-migration
   drafts round-trip v2 only"). */
function normalizeWizardState(saved){
  const base = defaultWizardState();
  if(!saved || typeof saved !== 'object') return base;
  const isOldShape = typeof saved.people === 'undefined' || typeof saved.assign === 'undefined';
  const isPreGalleryDraft = typeof saved.template === 'undefined';
  const working = isOldShape ? migrateToPeopleShape(saved) : saved;
  const out = Object.assign({}, base, working);
  // THE GALLERY (template #2) / THE FLIGHT (template #3) / THE DEFENSE
  // (template #4) -- an old (pre-Gallery) saved draft has no `template`
  // key at all; Object.assign above already left base's 'hangout' in place
  // for that case. Anything else unrecognized also falls back to
  // 'hangout', same "fail closed to the safe default" convention as
  // scene/sprite picks just below.
  if(['hangout', 'gallery', 'flight', 'defense', 'mission'].indexOf(out.template) === -1) out.template = 'hangout';
  // a pre-Gallery draft's saved `step` was an index into an even OLDER,
  // shorter Hangout sequence -- reinterpreting that same number against
  // today's sequence would silently land a returning visitor on the WRONG
  // step. Their answers are all still intact (migrated/preserved above) --
  // only the step position resets to 0, a mild "start the click-through
  // again" rather than a subtly wrong landing step. A migrated (but not
  // pre-Gallery) draft's step position is ALSO no longer meaningful (the
  // step layout itself changed shape this round -- group+cast collapsed
  // into one people step, see HANGOUT_STEP_KEYS' own header), so any
  // migration -- pre-Gallery or not -- resets to step 0.
  if(isPreGalleryDraft || isOldShape) out.step = 0;
  if(!Array.isArray(out.stories) || out.stories.length < 2) out.stories = base.stories;
  out.stories = out.stories.slice(0, 4).map(s => ({ l1: (s && typeof s.l1==='string') ? s.l1 : '', l2: (s && typeof s.l2==='string') ? s.l2 : '' }));
  if(!Array.isArray(out.targets) || out.targets.length < GALLERY_TARGETS_MIN) out.targets = base.targets;
  out.targets = out.targets.slice(0, GALLERY_TARGETS_MAX).map(t => (typeof t==='string') ? t.slice(0,24) : '');
  while(out.targets.length < GALLERY_TARGETS_MIN) out.targets.push('');
  // THE FLIGHT (template #3) -- beats keep whatever case was saved (see
  // buildOverridesFromState's own comment -- this is the one field that
  // deliberately never uppercases), hazards get capped the same way
  // targets are just above.
  if(!Array.isArray(out.beats) || out.beats.length < FLIGHT_BEATS_MIN) out.beats = base.beats;
  out.beats = out.beats.slice(0, FLIGHT_BEATS_MAX).map(b => (typeof b==='string') ? b.slice(0,90) : '');
  while(out.beats.length < FLIGHT_BEATS_MIN) out.beats.push('');
  if(!Array.isArray(out.hazards) || out.hazards.length < FLIGHT_HAZARDS_MIN) out.hazards = base.hazards;
  out.hazards = out.hazards.slice(0, FLIGHT_HAZARDS_MAX).map(h => (typeof h==='string') ? h.slice(0,24) : '');
  while(out.hazards.length < FLIGHT_HAZARDS_MIN) out.hazards.push('');
  if(!FLIGHT_PLANE_COLORS.some(c => c.key === out.planeColor)) out.planeColor = 'yellow';
  // THE DEFENSE (template #4) -- `defending` is a plain capped string, same
  // as `catchphrase`/`title` (no array normalization needed); `waves`
  // clamps the same way targets/beats/hazards do just above.
  if(typeof out.defending !== 'string') out.defending = base.defending;
  out.defending = out.defending.slice(0, 24);
  if(!Array.isArray(out.waves) || out.waves.length < DEFENSE_WAVES_MIN) out.waves = base.waves;
  out.waves = out.waves.slice(0, DEFENSE_WAVES_MAX).map(w => (typeof w==='string') ? w.slice(0,24) : '');
  while(out.waves.length < DEFENSE_WAVES_MIN) out.waves.push('');
  // THE MISSION (template #5) -- `mission` is a plain capped string, same
  // shape as `defending`; `swarms` clamps the same way waves/targets/beats/
  // hazards do just above; `shipColor` falls back to 'blue' the same way
  // `planeColor` falls back to 'yellow'.
  if(typeof out.mission !== 'string') out.mission = base.mission;
  out.mission = out.mission.slice(0, 40);
  if(!Array.isArray(out.swarms) || out.swarms.length < MISSION_SWARMS_MIN) out.swarms = base.swarms;
  out.swarms = out.swarms.slice(0, MISSION_SWARMS_MAX).map(s => (typeof s==='string') ? s.slice(0,24) : '');
  while(out.swarms.length < MISSION_SWARMS_MIN) out.swarms.push('');
  if(!MISSION_SHIP_COLORS.some(c => c.key === out.shipColor)) out.shipColor = 'blue';
  out.people = normalizePeopleArray(working.people);
  out.assign = normalizeAssign(working.assign, out.people.length);
  out.roleLines = normalizeRoleLines(working.roleLines);
  if(!SCENE_DEFS.some(s => s.key === out.scene)) out.scene = base.scene;
  if(typeof out.step !== 'number' || out.step < 0 || out.step >= stepCount(out.template)) out.step = 0;
  return out;
}

function serializeWizardState(state){ return JSON.stringify(state); }
function deserializeWizardState(json){
  try{ return normalizeWizardState(JSON.parse(json)); }catch(e){ return defaultWizardState(); }
}

/* live content gate: entirely per-group now -- there's no universal/
   baseline word list and no FREE-outside-FOR-FREE? special case anymore
   (see tools/verify-config.js's toneGateSource for the same rule on the
   server/CLI side of this exact mechanism) -- the gate is just THIS
   group's own off-limits words (state.offLimits, the punchline step's
   "Anything your game must never say?" field), checked whole-word,
   case-insensitive since this scans free-typed text, not a finished
   ALL-CAPS config file. Best-effort/client-side, per this project's own
   framing -- the paid path still gets FULFILLMENT.md's real human content
   review. Returns an array of short, friendly messages (empty = clean). */
function escapeRegexLite(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
/* raw comma-separated free text -> a capped, deduped, uppercased array --
   10 entries x 40 chars each (cfgSanitizeConfig's own forbiddenWords cap,
   game/cfgcodec.js's CFG_FRAGMENT_SCHEMA, additionally truncates any one
   word to 30 chars at encode time -- this is just the wizard's own
   friendlier pre-cap, never a second source of truth for the real limit). */
function parseOffLimits(raw){
  const seen = new Set();
  const out = [];
  for(const part of String(raw || '').split(',')){
    const w = part.trim().toUpperCase().slice(0, 40);
    if(!w || seen.has(w)) continue;
    seen.add(w);
    out.push(w);
    if(out.length >= 10) break;
  }
  return out;
}
function checkForbidden(text, offLimitsWords){
  if(!text || !offLimitsWords || !offLimitsWords.length) return [];
  const violations = [];
  const upper = String(text).toUpperCase();
  for(const w of offLimitsWords){
    const re = new RegExp('\\b' + escapeRegexLite(w) + '\\b');
    if(re.test(upper)) violations.push('Contains "' + w + '" -- your own off-limits list says this can’t appear in the game text.');
  }
  return violations;
}
function checkStateForbidden(state){
  const words = parseOffLimits(state.offLimits);
  const fields = [state.catchphrase, state.title];
  if(state.template === 'gallery'){
    for(const t of state.targets) fields.push(t);
  } else if(state.template === 'flight'){
    for(const b of state.beats) fields.push(b);
    for(const h of state.hazards) fields.push(h);
  } else if(state.template === 'defense'){
    fields.push(state.defending);
    for(const w of state.waves) fields.push(w);
  } else if(state.template === 'mission'){
    fields.push(state.mission);
    for(const sw of state.swarms) fields.push(sw);
  } else {
    for(const s of state.stories){ fields.push(s.l1); fields.push(s.l2); }
  }
  // PEOPLE FIRST (SPEC-people.md round 2) -- "the off-limits check extends
  // over people names + quotes": every person's name/anecdote/quotes,
  // whether or not they ended up assigned a role (an unassigned person
  // still ships -- as cast.diner0 or an extras[] entry -- so their text
  // needs the same gate as anyone else's).
  for(const p of (state.people || [])){
    fields.push(p.name); fields.push(p.anecdote);
    for(const q of p.quotes) fields.push(q);
  }
  fields.push(state.roleLines && state.roleLines.critic);
  fields.push(state.roleLines && state.roleLines.boss);
  const all = [];
  for(const f of fields) all.push(...checkForbidden(f, words));
  return Array.from(new Set(all));
}

function wrapLine(raw, maxLen){
  const s = String(raw||'').trim().toUpperCase().replace(/\s+/g,' ');
  return s.length > maxLen ? s.slice(0, maxLen) : s;
}
/* THE FLIGHT (template #3): trip beats keep the group's TYPED case (see
   SPEC-flight.md's wizard bullet -- "beats keep typed case, hazards
   uppercase like targets") -- they read as the breather's narrated prose,
   not a shouty plaque label, so this is the one text field in the wizard
   that deliberately does NOT uppercase. Mirrors tools/generate.js's own
   wrapLineKeepCase exactly. */
function wrapLineKeepCase(raw, maxLen){
  const s = String(raw||'').trim().replace(/\s+/g,' ');
  return s.length > maxLen ? s.slice(0, maxLen) : s;
}

/* mirrors tools/generate.js's buildOverrides -- same shape, same
   defaults, reading from the wizard's own state object instead of an
   answers.json file. NOT run through cfgSanitizeConfig itself (that
   happens once, uniformly, in assembleConfig below) -- this function's
   only job is "wizard state -> a CONFIG-shaped overrides object".

   THE GALLERY (template #2) / THE FLIGHT (template #3) / THE DEFENSE
   (template #4): branches on state.template, four ways now. The shared
   fields (title/punchline/host/forbiddenWords/cast) are built identically
   across all four; scene/stories/lengthPreset are Hangout-only (neither
   gallery/engine.js nor flight/engine.js nor defense/engine.js reads
   them), gallery.targets/firstBossHeckle/finalBossQuirk are Gallery-only,
   flight.beats/hazards/planeColor/firstBossHeckle/finalBossQuirk are
   Flight-only, defense.defending/waves/firstBossHeckle/finalBossQuirk are
   Defense-only. Per-role judge.title/authority.cardTitle CONTENT BLOCKS
   are Hangout-only -- gallery/engine.js, flight/engine.js, and
   defense/engine.js each build their own boss-card/banner/tower-label
   titles straight from CAST.judge.name/CAST.authority.name (see gallery/
   engine.js's CARDS.boss/CARDS.finale, flight/engine.js's
   enterFinalBoss, and defense/engine.js's roleName/enterTurnGood), none
   of them ever read CONFIG.judge/CONFIG.authority. */
/* PEOPLE FIRST (SPEC-people.md round 2) -- a person's 1-3 quotes ->
   overrides-ready form (wrapped/capped/blank-filtered), or null when they
   have none to contribute. Shared by every branch below (host/diner0/
   extras/role entries) so the exact same wrap-and-cap rule applies
   everywhere a person's quotes end up in the compiled config. */
function personQuoteOverrides(p){
  if(!p || !Array.isArray(p.quotes)) return null;
  const q = p.quotes.map(s => wrapLine(s, 60)).filter(Boolean).slice(0, 3);
  return q.length ? q : null;
}
function buildOverridesFromState(state){
  const hostPerson = personAt(state, state.assign && state.assign.host);
  const host = wrapLine((hostPerson && hostPerson.name) || 'HOST', 40);
  const title = String(state.title || 'My Game').trim();
  const isGallery = state.template === 'gallery';
  const isFlight = state.template === 'flight';
  const isDefense = state.template === 'defense';
  const isMission = state.template === 'mission';
  const overrides = {
    // absent -> 'hangout' (cfgBuildDefaultConfig's own default templateKey)
    // -- same "no explicit default value on the wire" convention musicVibe
    // just below already uses. Four-way now (THE DEFENSE is template #4).
    template: isGallery ? 'gallery' : (isFlight ? 'flight' : (isDefense ? 'defense' : (isMission ? 'mission' : undefined))),
    // an ENUM pick among a fixed set of built-in stock tracks -- see
    // game/cfgcodec.js's cfgApplyMusicVibe for why this is the one
    // narrow exception to "no music from a fragment, ever" (never an
    // arbitrary URL, just one of 5 known keys). 'surprise'/unset -> no
    // override, stock Wacky Waiting default (cfgSanitizeConfig drops an
    // unrecognized/absent enum value harmlessly either way).
    musicVibe: state.vibe && state.vibe !== 'surprise' ? state.vibe : undefined,
    title: {
      lockupLines: wrapTitleLines(title, 14, 2),
      introPageTitle: title,
      gamePageTitle: title + ' -- Playable Demo',
    },
    punchline: wrapLine(state.catchphrase || 'CLASSIC.', 40),
    host: { name: host },
    // per-group tone gate -- see checkForbidden/parseOffLimits above; an
    // empty off-limits field is a valid, common answer (forbiddenWords: []).
    forbiddenWords: parseOffLimits(state.offLimits),
    cast: {},
  };
  // PEOPLE FIRST (SPEC-people.md round 2) -- host's own sprite/quotes;
  // an explicit pick wins outright (game/roster.js's rosterResolveSprite
  // -- sprite enum beats spriteCol/Row), same precedent every sprite pick
  // below follows too.
  if(hostPerson){
    if(hostPerson.sprite && ROSTER_BY_KEY[hostPerson.sprite]) overrides.host.sprite = hostPerson.sprite;
    const hq = personQuoteOverrides(hostPerson);
    if(hq) overrides.host.quotes = hq;
  }
  // people+assign -> host/cast.<cfgKey> (above/below) + cast.diner0 +
  // extras[] (SPEC-people.md's compile-down): the first person nobody
  // assigned a role becomes diner0 (today's "extra friend" slot, unchanged
  // shape -- just filled from whoever's left over instead of a dedicated
  // "anyone else?" field); up to 2 more become `extras[]`. People beyond
  // that cap still exist in `state.people` (the wizard's own overflow gate
  // in renderStepPreview blocks sharing until the group is trimmed to fit
  // or more roles are assigned -- see that function), so this slice is
  // never silently lossy in practice.
  const leftover = unassignedPeople(state);
  const diner0Person = leftover[0] || null;
  const extrasPeople = leftover.slice(1, 3);
  overrides.cast.diner0 = (diner0Person && diner0Person.name && diner0Person.name.trim())
    ? Object.assign(
        { name: wrapLine(diner0Person.name, 40), anecdote: (diner0Person.anecdote && diner0Person.anecdote.trim()) ? diner0Person.anecdote.trim().slice(0, 160) : 'Always up for anything.' },
        DEFAULT_SPRITE.diner0,
        (diner0Person.sprite && ROSTER_BY_KEY[diner0Person.sprite]) ? { sprite: diner0Person.sprite } : {},
        (function(){ const q = personQuoteOverrides(diner0Person); return q ? { quotes: q } : {}; })()
      )
    : Object.assign({ name: 'THE FOURTH FRIEND', anecdote: 'Always up for anything.' }, DEFAULT_SPRITE.diner0);
  const extrasOverrides = extrasPeople
    .filter(p => p && p.name && p.name.trim())
    .map(p => {
      const e = { name: wrapLine(p.name, 40) };
      if(p.sprite && ROSTER_BY_KEY[p.sprite]) e.sprite = p.sprite;
      const q = personQuoteOverrides(p);
      if(q) e.quotes = q;
      return e;
    });
  if(extrasOverrides.length) overrides.extras = extrasOverrides;
  if(isGallery){
    overrides.gallery = {
      targets: state.targets.filter(t => t && t.trim()).slice(0, GALLERY_TARGETS_MAX).map(t => wrapLine(t, 24)),
    };
  } else if(isFlight){
    // THE FLIGHT (template #3, see SPEC-flight.md's config/codec/wizard
    // section) -- beats keep typed case (wrapLineKeepCase), hazards
    // uppercase like targets (wrapLine).
    overrides.flight = {
      beats: state.beats.filter(b => b && b.trim()).slice(0, FLIGHT_BEATS_MAX).map(b => wrapLineKeepCase(b, 90)),
      hazards: state.hazards.filter(h => h && h.trim()).slice(0, FLIGHT_HAZARDS_MAX).map(h => wrapLine(h, 24)),
      planeColor: FLIGHT_PLANE_COLORS.some(c => c.key === state.planeColor) ? state.planeColor : 'yellow',
    };
  } else if(isDefense){
    // THE DEFENSE (template #4, see SPEC-defense.md's config/codec/wizard
    // section) -- defending/waves both uppercase like targets (this
    // template has no "keep typed case" field the way the flight's beats
    // do -- every defense label is a shouted plaque/banner, not narrated
    // prose). `defending` falls back to cfgBuildDefenseDefaultConfig's own
    // neutral default ('THE COUCH') the same defensive way `host`/
    // `punchline` do just above, even though the real required-field gate
    // lives in renderStepPreview's contentOk.
    overrides.defense = {
      defending: wrapLine(state.defending || 'THE COUCH', 24),
      waves: state.waves.filter(w => w && w.trim()).slice(0, DEFENSE_WAVES_MAX).map(w => wrapLine(w, 24)),
    };
  } else if(isMission){
    // THE MISSION (template #5, see SPEC-mission.md's config/codec/wizard
    // section) -- mission/swarms both uppercase like targets/waves (this
    // template has no "keep typed case" field the way the flight's beats
    // do -- the mission line is a shouted banner, not narrated prose).
    // `mission` falls back to cfgBuildMissionDefaultConfig's own neutral
    // default ('GET EVERYONE HOME') the same defensive way `defending`
    // does just above, even though the real required-field gate lives in
    // renderStepPreview's contentOk.
    overrides.mission = {
      mission: wrapLine(state.mission || 'GET EVERYONE HOME', 40),
      swarms: state.swarms.filter(sw => sw && sw.trim()).slice(0, MISSION_SWARMS_MAX).map(sw => wrapLine(sw, 24)),
      shipColor: MISSION_SHIP_COLORS.some(c => c.key === state.shipColor) ? state.shipColor : 'blue',
    };
  } else {
    overrides.lengthPreset = 'five_min';
    // STORY SKELETONS: which of the four settings (see SCENE_DEFS above) --
    // an enum pick, same "fixed built-in key, never a free string" shape as
    // musicVibe. Falls back to 'dinner' if state.scene is somehow missing/
    // invalid (shouldn't happen -- normalizeWizardState already guards
    // this -- but assembleConfig should never crash on it).
    overrides.scene = SCENE_DEFS.some(s => s.key === state.scene) ? state.scene : 'dinner';
    overrides.stories = state.stories
      .filter(s => (s.l1 && s.l1.trim()) || (s.l2 && s.l2.trim()))
      .slice(0, 4)
      .map(s => ({ lines: [s.l1, s.l2].map(l => wrapLine(l, 40)).filter(Boolean) }));
  }
  // PEOPLE FIRST (SPEC-people.md round 2) -- one entry per role, read off
  // whichever person (if any) state.assign points that role at; the two
  // boss-line fields (heckle/quirk) read state.roleLines, keyed on the
  // ROLE not the person (see that field's own header comment) -- only
  // written when the role actually has someone assigned AND they typed a
  // line; blank/skipped falls back to that engine's own neutral fallback
  // pool same as before (round 1, SPEC-people.md, additionally prefers
  // the assigned person's own quotes over that neutral pool when they
  // have any -- see e.g. gallery/engine.js's FIRST_BOSS_HECKLE_POOL).
  for(const r of ROLE_DEFS){
    const p = personAt(state, state.assign && state.assign[r.key]);
    if(p && p.name && p.name.trim()){
      const entry = { name: wrapLine(p.name, 40) };
      if(p.anecdote && p.anecdote.trim()) entry.anecdote = String(p.anecdote).trim().slice(0, 160);
      if(DEFAULT_SPRITE[r.cfgKey]) Object.assign(entry, DEFAULT_SPRITE[r.cfgKey]);
      if(p.sprite && ROSTER_BY_KEY[p.sprite]) entry.sprite = p.sprite;
      const pq = personQuoteOverrides(p);
      if(pq) entry.quotes = pq;
      overrides.cast[r.cfgKey] = entry;
      const roleLine = r.key === 'critic' ? (state.roleLines && state.roleLines.critic) : r.key === 'boss' ? (state.roleLines && state.roleLines.boss) : null;
      if(!isGallery && !isFlight && !isDefense && !isMission){
        // BOSS SLOTS: the boss HP bar / entrance card should read the
        // actual person's name, not the generic "THE CRITIC"/"THE BOSS HAS
        // ARRIVED" default text (see cfgBuildDefaultConfig, which those
        // defaults still come from for anyone who leaves this slot
        // uncast). entry.name is already uppercase (wrapLine), matching
        // the "'<NAME> HAS ARRIVED'" pattern (see FULFILLMENT.md's "Boss
        // slots read as real people") -- cfgSanitizeConfig's own cfgStr(40)
        // cap on judge.title/authority.cardTitle truncates safely if a
        // long name pushes " HAS ARRIVED" past the limit.
        if(r.cfgKey === 'judge') overrides.judge = { title: entry.name };
        if(r.cfgKey === 'authority') overrides.authority = { cardTitle: entry.name + ' HAS ARRIVED' };
      } else if(isGallery && r.galleryField && roleLine && roleLine.trim()){
        // THE GALLERY: the two optional boss lines live in gallery.
        // firstBossHeckle/finalBossQuirk (CFG_GALLERY_SCHEMA), not a
        // per-role content block -- blank/skipped falls back to gallery/
        // engine.js's own neutral fallback pools (see that file's header).
        overrides.gallery = overrides.gallery || {};
        overrides.gallery[r.galleryField.key === 'heckle' ? 'firstBossHeckle' : 'finalBossQuirk'] = wrapLine(roleLine, r.galleryField.maxLen);
      } else if(isFlight && r.flightField && roleLine && roleLine.trim()){
        // THE FLIGHT: same shape as the gallery branch just above, but
        // flight.firstBossHeckle/finalBossQuirk (CFG_FLIGHT_SCHEMA) --
        // blank/skipped falls back to flight/engine.js's own neutral
        // fallback pools (see that file's header).
        overrides.flight = overrides.flight || {};
        overrides.flight[r.flightField.key === 'heckle' ? 'firstBossHeckle' : 'finalBossQuirk'] = wrapLine(roleLine, r.flightField.maxLen);
      } else if(isDefense && r.defenseField && roleLine && roleLine.trim()){
        // THE DEFENSE: same shape as the gallery/flight branches above, but
        // defense.firstBossHeckle/finalBossQuirk (CFG_DEFENSE_SCHEMA) --
        // blank/skipped falls back to defense/engine.js's own neutral
        // fallback pools (see that file's header).
        overrides.defense = overrides.defense || {};
        overrides.defense[r.defenseField.key === 'heckle' ? 'firstBossHeckle' : 'finalBossQuirk'] = wrapLine(roleLine, r.defenseField.maxLen);
      } else if(isMission && r.missionField && roleLine && roleLine.trim()){
        // THE MISSION: same shape as the gallery/flight/defense branches
        // above, but mission.firstBossHeckle/finalBossQuirk
        // (CFG_MISSION_SCHEMA) -- blank/skipped falls back to
        // mission/engine.js's own neutral fallback pools (see that file's
        // header).
        overrides.mission = overrides.mission || {};
        overrides.mission[r.missionField.key === 'heckle' ? 'firstBossHeckle' : 'finalBossQuirk'] = wrapLine(roleLine, r.missionField.maxLen);
      }
    } else {
      overrides.cast[r.cfgKey] = null;
    }
  }
  return overrides;
}
function wrapTitleLines(raw, maxLineLen, maxLines){
  const words = String(raw).trim().toUpperCase().replace(/\s+/g,' ').split(' ').filter(Boolean);
  if(words.length <= 1) return [wrapLine(raw, maxLineLen)];
  const mid = Math.ceil(words.length/2);
  const lines = [words.slice(0,mid).join(' '), words.slice(mid).join(' ')].filter(Boolean).slice(0,maxLines);
  return lines.map(l => l.length > maxLineLen ? l.slice(0,maxLineLen) : l);
}

/* the whole point: build overrides -> whitelist-sanitize them through the
   EXACT SAME cfgSanitizeConfig a real `#cfg=` link is validated against
   (game/cfgcodec.js, loaded above) -- so "preview" and "the real
   shareable link" can never drift apart -- then deep-merge onto the
   neutral default template and return { merged, sanitized }. Requires
   `cfgSanitizeConfig`/`cfgDeepMerge`/`cfgBuildDefaultConfig` to be in
   scope (from cfgcodec.js); throws if they aren't -- callers/tests must
   load that file first, same as the real engines do. */
function assembleConfig(state, engineRoot){
  const overrides = buildOverridesFromState(state);
  const sanitized = cfgSanitizeConfig(overrides);
  // STORY SKELETONS / THE GALLERY: build the base off the picked scene AND
  // template, same as a real `#cfg=` link (cfgLoadFragmentOverride) does --
  // so the preview shown here matches exactly what opening the shared link
  // produces, not just for dialogue/cast/music but for the scene's own
  // flavor text (Hangout) or the neutral gallery-section defaults (see
  // cfgBuildGalleryDefaultConfig) too.
  const base = cfgBuildDefaultConfig(engineRoot, sanitized.scene, sanitized.template);
  const merged = cfgDeepMerge(base, sanitized);
  // mirrors exactly what cfgLoadFragmentOverride does when a real link is
  // opened -- same hash seed too (JSON.stringify(sanitized), not yet a
  // compressed fragment at this point) -- so the preview's music matches
  // what sharing the link actually produces, not just its dialogue/cast,
  // including which curated set "Surprise us" (or no vibe picked at all)
  // resolves to.
  cfgApplyMusicVibe(merged, sanitized.musicVibe, engineRoot, JSON.stringify(sanitized));
  delete merged.musicVibe;
  return { overrides: overrides, sanitized: sanitized, merged: merged };
}

/* ---------------------------------------------------------------------
   DOM WIRING -- everything below touches document/window/localStorage.
   Guarded behind initWizard(), only ever invoked via DOMContentLoaded, so
   merely `eval`-ing this whole script (as a headless harness does) never
   runs any of it.
   --------------------------------------------------------------------- */
function initWizard(){
  const SITE_CONFIG = {
    // mirrors the root index.html's own SITE_CONFIG -- duplicated by the
    // same convention noted above; keep both in sync by hand.
    intakeFormUrl: null,
    paymentUrl: null,
  };
  const ENGINE_ROOT = new URL('../', document.location.href).href;

  let state = normalizeWizardState((function(){
    try{ const raw = localStorage.getItem(WIZARD_STORAGE_KEY); return raw ? JSON.parse(raw) : null; }catch(e){ return null; }
  })());

  function persist(){
    try{ localStorage.setItem(WIZARD_STORAGE_KEY, serializeWizardState(state)); }catch(e){}
  }

  const stepsContainer = document.getElementById('stepsContainer');
  const progressRow = document.getElementById('progressRow');
  const stepLabelEl = document.getElementById('stepLabel');

  let currentAudio = null;
  function stopPreview(){ if(currentAudio){ try{ currentAudio.pause(); }catch(e){} currentAudio = null; } }

  // THE GALLERY (template #2) -- the step count/progress segments/label
  // all read the CURRENT template's own sequence (see stepSequence/
  // STEP_LABELS above) -- the two paths have different step counts (8 vs
  // 7), so this can never be a fixed constant anymore.
  function renderProgress(){
    const seq = stepSequence(state.template);
    progressRow.innerHTML = '';
    for(let i=0;i<seq.length;i++){
      const seg = document.createElement('div');
      seg.className = 'progress-seg' + (i < state.step ? ' done' : (i === state.step ? ' current' : ''));
      progressRow.appendChild(seg);
    }
    stepLabelEl.textContent = 'Step ' + (state.step+1) + ' of ' + seq.length + ' -- ' + STEP_LABELS[seq[state.step]];
  }

  // NOTE on field-level warnings/counters: each render*Step function below
  // wraps every label+input pair in its own `.field` div and passes THAT
  // specific wrapper to fieldWarning()/makeCharCounter() (rather than a
  // shared parent multiple fields sit in) -- so a warning or char count
  // always lands next to the field it belongs to, even when a step has
  // more than one text input.
  function fieldWarning(container, text){
    let el = container.querySelector('.field-warning');
    if(!el){ el = document.createElement('div'); el.className = 'field-warning'; container.appendChild(el); }
    if(text){ el.textContent = text; el.classList.add('show'); }
    else { el.classList.remove('show'); }
  }

  function makeCharCounter(input, maxLen, wrapEl){
    const counter = document.createElement('div');
    counter.className = 'charcount';
    function update(){
      const len = input.value.length;
      counter.textContent = len + ' / ' + maxLen;
      counter.classList.toggle('over', len > maxLen);
    }
    input.addEventListener('input', update);
    update();
    wrapEl.appendChild(counter);
    return counter;
  }

  function drawRoleIcon(canvas, roleKey){
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const S = 4; // pixel scale
    const ICONS = {
      critic: ['000011110000','000100001000','001000000100','010000000010','010003330010','010030300010','010003330010','001000000100','000100001000','000011110000','000000110000','000001111000'],
      boss:   ['000111111000','001111111100','011111111110','011003300110','011000000110','011111111110','001101101100','001101101100','000110110000','000111111000','000111111000','000011110000'],
      savior: ['000001100000','000011110000','000111111000','001111111100','011111111110','000111111000','000011110000','000001100000','000110011000','001100001100','011000000110','000000000000'],
      butterfingers: ['000111111000','001111111100','011000000110','011033330110','011030030110','011033330110','011000000110','001111111100','000111111000','000001100000','000011110000','000000000000'],
      builder: ['000000011000','000000111100','000001111110','000011001110','000110000000','011000000000','000000110000','000001111000','000011001100','000110000110','011000000011','000000000000'],
    };
    const grid = ICONS[roleKey] || ICONS.critic;
    const rows = grid.length, cols = grid[0].length;
    canvas.width = cols*S; canvas.height = rows*S;
    ctx.fillStyle = '#1a1410'; ctx.fillRect(0,0,canvas.width,canvas.height);
    for(let r=0;r<rows;r++){
      for(let c=0;c<cols;c++){
        const ch = grid[r][c];
        if(ch==='0') continue;
        ctx.fillStyle = ch==='1' ? '#e8b84b' : '#c96f4a';
        ctx.fillRect(c*S, r*S, S, S);
      }
    }
  }

  /* ---------------------------------------------------------------------
     PHASE C (characters are their people) -- sprite strip. Draws real
     16x16 tiles cropped straight out of the roster's own sheet PNGs
     (game/roster.js, loaded above this script) at pixelated upscale, one
     shared <img> per sheet (lazy-loaded, cached) so every swatch across
     every strip on the page reuses the same 4 downloads.
     --------------------------------------------------------------------- */
  const SPRITE_SHEET_IMAGES = {};
  function getSpriteSheetImage(sheetKey){
    let img = SPRITE_SHEET_IMAGES[sheetKey];
    if(img) return img;
    img = new Image();
    img.src = ENGINE_ROOT + (ROSTER_SHEETS[sheetKey] ? ROSTER_SHEETS[sheetKey].path : ROSTER_SHEETS.dungeon.path);
    SPRITE_SHEET_IMAGES[sheetKey] = img;
    return img;
  }
  function drawRosterSwatch(canvas, rosterKey){
    const entry = ROSTER_BY_KEY[rosterKey];
    if(!entry) return;
    const S = 3; // 16px tile -> 48px swatch, pixelated
    canvas.width = 16*S; canvas.height = 16*S;
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    const img = getSpriteSheetImage(entry.sheet);
    function paint(){ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img, entry.col*16, entry.row*16, 16, 16, 0, 0, canvas.width, canvas.height); }
    if(img.complete && img.naturalWidth>0) paint();
    else img.addEventListener('load', paint, { once:true });
  }

  /* wrapEl gets replaced with a labeled, scrollable strip of every
     ROSTER entry -- tap to pick. `currentKey` (may be null/undefined --
     "no explicit pick yet") drives which swatch starts selected;
     `fallbackKey` (may also be undefined -- "no bespoke default tile to
     preselect", i.e. authority/savior) is what shows selected when
     currentKey is unset, purely a visual "this is what you get if you
     don't touch this" cue -- it does NOT itself get written to state
     (skipping the picker entirely is what leaves state.*.sprite null,
     see buildOverridesFromState: an unset pick changes nothing). `onPick`
     fires with the tapped roster key. */
  function renderSpriteStrip(container, label, currentKey, fallbackKey, onPick){
    const field = document.createElement('div');
    field.className = 'sprite-field';
    const lbl = document.createElement('p');
    lbl.className = 'sprite-field-label';
    lbl.textContent = label;
    field.appendChild(lbl);
    const strip = document.createElement('div');
    strip.className = 'sprite-strip';
    const selectedKey = currentKey || fallbackKey || null;
    for(const entry of ROSTER){
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'sprite-swatch' + (entry.key === selectedKey ? ' selected' : '');
      btn.setAttribute('aria-pressed', entry.key === selectedKey ? 'true' : 'false');
      btn.title = entry.label + ' (' + ROSTER_SHEETS[entry.sheet].pack + ')';
      const canvas = document.createElement('canvas');
      drawRosterSwatch(canvas, entry.key);
      btn.appendChild(canvas);
      btn.addEventListener('click', ()=>{
        strip.querySelectorAll('.sprite-swatch').forEach(b=>{ b.classList.remove('selected'); b.setAttribute('aria-pressed','false'); });
        btn.classList.add('selected');
        btn.setAttribute('aria-pressed','true');
        onPick(entry.key);
      });
      strip.appendChild(btn);
    }
    field.appendChild(strip);
    container.appendChild(field);
  }
